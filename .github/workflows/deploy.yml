name: Build and publish to docs/ (GitHub Pages)

# GitHub Pages is configured as "Deploy from a branch" using the /docs folder.
# This workflow rebuilds the Vite app into docs/ and commits it on push, so the
# published site always matches the source. Pushes made with GITHUB_TOKEN do not
# retrigger workflows, so this does not loop.

on:
  push:
    branches:
      - claude/zork-typescript-impl-ugpsyr
      - main
      - master
    paths-ignore:
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-docs
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build web app into docs/
        run: bun run build
        env:
          VITE_BASE: /zork/

      - name: Commit updated docs/
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain docs)" ]; then
            git add docs
            git commit -m "Build: publish web app to docs/ [skip ci]"
            git push
          else
            echo "docs/ already up to date"
          fi
